<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo Favicon KBEL">
  <defs>
    <!-- Dégradé Fond Noir / Vert Forêt profond -->
    <linearGradient id="kbelDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E0F" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <!-- Dégradé Sauge / Citron lumineux -->
    <linearGradient id="kbelLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90A955" />
      <stop offset="100%" stop-color="#ECF39E" />
    </linearGradient>
    <!-- Ombre portée -->
    <filter id="kbelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fond arrondi 14px -->
  <rect width="64" height="64" rx="14" fill="url(#kbelDarkGrad)" filter="url(#kbelShadow)" />

  <!-- Bordure intérieure verte discrète -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#4F772D" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Lettre K stylisée et nette en blanc pur -->
  <text x="32" y="44" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.02em">K</text>

  <!-- Filet vert citron / sauge emblématique -->
  <rect x="18" y="49" width="28" height="3.5" rx="1.75" fill="url(#kbelLimeGrad)" />
</svg>
